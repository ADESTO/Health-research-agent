# Runs the test suite on every push and pull request. The tests need a real Postgres with pgvector (they
# wipe it), so CI starts a throwaway one; no API keys are used: the tests run on a scripted fake model.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: research_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5433/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: psql "$TEST_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: python -m pytest -q
